  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script>
      // The dev server restarts when the plugin or the config changes. The
      // browser then cannot reconnect to the hot-reload socket and the page
      // keeps running the old code, so say so instead of failing quietly.
      (function () {
        // The Vite client is only injected in dev, so this never runs in a
        // production build.
        if (!document.querySelector('script[src*="@vite/client"]')) return;

        var shown = false;
        var show = function () {
          if (shown || document.getElementById('dev-reload-hint')) return;
          shown = true;
          var bar = document.createElement('div');
          bar.id = 'dev-reload-hint';
          bar.setAttribute(
            'style',
            'position:fixed;top:0;left:0;right:0;z-index:9999;background:#f59e0b;color:#111827;font:600 13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding:9px 14px;display:flex;gap:14px;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35)'
          );
          var text = document.createElement('span');
          text.textContent =
            'The dev server restarted, so this page still runs the old code.';
          var button = document.createElement('button');
          button.textContent = 'Reload';
          button.setAttribute(
            'style',
            'background:#111827;color:#fbbf24;border:0;border-radius:6px;padding:5px 12px;font:inherit;cursor:pointer'
          );
          button.onclick = function () {
            location.reload();
          };
          bar.appendChild(text);
          bar.appendChild(button);
          document.body.appendChild(bar);
        };

        // A socket that drops after the server restarts.
        window.addEventListener('vite:ws:disconnect', show);

        // A socket that never opens, which is what a stale tab gets.
        var originalError = console.error;
        console.error = function () {
          var text = Array.prototype.map
            .call(arguments, function (arg) {
              return typeof arg === 'string' ? arg : (arg && arg.message) || '';
            })
            .join(' ');
          if (text.indexOf('failed to connect to websocket') !== -1) show();
          return originalError.apply(console, arguments);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
